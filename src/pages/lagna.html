<main class="wrap page lagna-page">
  <div class="page-hero">
    <p class="eyebrow">{{nav.lagna}}</p>
    <h1>{{pages.lagna.title}}</h1>
    <p class="lede">{{pages.lagna.description}}</p>
  </div>

  <form class="card toolbar lagna-form" id="lg-form" novalidate>
    <select class="pick-saved" id="lg-saved" hidden aria-label="{{mt.pick}}"></select>
    <div class="field">
      <label for="lg-name">{{form.name}}</label>
      <input type="text" id="lg-name" placeholder="{{form.namePh}}">
    </div>
    <div class="row2">
      <div class="field">
        <label for="lg-date">{{form.date}}</label>
        <input type="date" id="lg-date" required>
      </div>
      <div class="field">
        <label for="lg-time">{{form.time}}</label>
        <input type="time" id="lg-time" step="60" value="12:00" required>
      </div>
    </div>
    <!--CITY-->
    <button class="btn-cta" type="submit">{{form.submit}}</button>
  </form>

  <div id="lg-res"></div>
  <section class="static-sec"><div class="about"><!--INFO--></div></section>
</main>
