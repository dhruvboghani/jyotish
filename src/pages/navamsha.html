<main class="wrap page navamsha-page">
  <div class="page-hero">
    <p class="eyebrow">{{nav.navamsha}}</p>
    <h1>{{pages.navamsha.title}}</h1>
    <p class="lede">{{pages.navamsha.description}}</p>
  </div>

  <form class="card toolbar navamsha-form" id="nv-form" novalidate>
    <select class="pick-saved" id="nv-saved" hidden aria-label="{{mt.pick}}"></select>
    <div class="field">
      <label for="nv-name">{{form.name}}</label>
      <input type="text" id="nv-name" placeholder="{{form.namePh}}">
    </div>
    <div class="row2">
      <div class="field">
        <label for="nv-date">{{form.date}}</label>
        <input type="date" id="nv-date" required>
      </div>
      <div class="field">
        <label for="nv-time">{{form.time}}</label>
        <input type="time" id="nv-time" step="60" value="12:00" required>
      </div>
    </div>
    <!--CITY-->
    <button class="btn-cta" type="submit">{{form.submit}}</button>
  </form>

  <div id="nv-res"></div>
  <section class="static-sec"><div class="about"><!--INFO--></div></section>
</main>
