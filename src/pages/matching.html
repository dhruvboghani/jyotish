<main class="wrap page">
  <div class="page-hero"><p class="eyebrow">{{mt.eye}} <span class="tag gold">{{members.badge}}</span></p><h1>{{mt.title}}</h1><p class="lede">{{mt.lede}}</p></div>
  <div class="premium-why" id="m-lock"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-lock"/></svg><span><b>{{members.title}}</b>{{mt.lockNote}}</span></div>
  <form id="mform" novalidate autocomplete="off">
    <div class="mforms"><!--PERSON:b--><!--PERSON:g--></div>
    <p class="err" id="m-err" role="alert"></p>
    <button class="btn-cta go" type="submit" id="m-go">{{mt.submit}}</button>
  </form>
  <div id="mres" class="mres"></div>
  <section class="card mrank no-print" id="mrank"><h2 class="h3">{{mr.title}}</h2><p class="muted small">{{mr.lede}}</p>
    <div class="mrank-f"><div class="field"><label for="mr-who">{{mr.who}}</label><select id="mr-who"></select></div><div class="field"><label for="mr-as">{{mr.as}}</label><select id="mr-as"><option value="boy">{{mt.boy}}</option><option value="girl">{{mt.girl}}</option></select></div><button type="button" class="btn-cta" id="mr-go">{{mr.go}}</button></div>
    <div id="mr-res"></div></section>
  <section class="static-sec"><div class="about"><!--INFO--></div></section>
</main>
