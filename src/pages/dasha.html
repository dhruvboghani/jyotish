<main class="wrap page dasha-page">
  <div class="page-hero">
    <p class="eyebrow">{{nav.dasha}}</p>
    <h1>{{pages.dasha.title}}</h1>
    <p class="lede">{{pages.dasha.description}}</p>
  </div>

  <form class="card toolbar dasha-form" id="ds-form" novalidate>
    <select class="pick-saved" id="ds-saved" hidden aria-label="{{mt.pick}}"></select>
    <div class="field">
      <label for="ds-name">{{form.name}}</label>
      <input type="text" id="ds-name" placeholder="{{form.namePh}}">
    </div>
    <div class="row2">
      <div class="field">
        <label for="ds-date">{{form.date}}</label>
        <input type="date" id="ds-date" required>
      </div>
      <div class="field">
        <label for="ds-time">{{form.time}}</label>
        <input type="time" id="ds-time" step="60" value="12:00" required>
      </div>
    </div>
    <!--CITY-->
    <button class="btn-cta" type="submit">{{form.submit}}</button>
  </form>

  <div id="ds-res"></div>
  <section class="static-sec"><div class="about"><!--INFO--></div></section>
</main>
