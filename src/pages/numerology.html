<main class="wrap page nu-page">
  <div class="page-hero"><p class="eyebrow">{{nu.eye}}</p><h1>{{nu.title}}</h1><p class="lede">{{nu.lede}}</p></div>
  <form id="nu-form" class="card toolbar nu-form" novalidate>
    <select class="pick-saved" id="nu-saved" hidden aria-label="{{mt.pick}}"></select>
    <div class="field"><label for="nu-name">{{nu.name}}</label><input id="nu-name" type="text" autocomplete="name" placeholder="{{nu.namePh}}" maxlength="60"></div>
    <div class="field"><label for="nu-date">{{nu.date}}</label><input id="nu-date" type="date" required></div>
    <button class="btn-cta" type="submit">{{nu.submit}}</button>
  </form>
  <div id="nu-res" aria-live="polite"><p class="muted small">{{nu.needDate}}</p></div>
  <section class="static-sec"><div class="about"><!--INFO--></div></section>
  <section class="seo-hub no-print"><!--SEOLINKS:numerology--></section>
</main>
